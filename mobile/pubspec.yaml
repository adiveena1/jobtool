name: career_os
description: Career OS — your AI career agent. Native Flutter client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State — Riverpod, as specified. Providers are declared per feature.
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  http: ^1.2.2

  # Secure token storage. Access tokens never touch SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # Value equality for models and state
  equatable: ^2.0.5

  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
